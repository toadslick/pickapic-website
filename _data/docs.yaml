items:
  - title: "Pick-a-Pic Documents"
    items:
      - title: "Create or open a document"
        text:
          - "Your Picture Library and Button Books live in a file known as a **Pick-a-Pic document**."
          - "The app first opens to the document picker. Tap the *Create Document* icon or the *+* button to create a new Pick-a-Pic document. To open an existing document, tap that document's icon."
        images:
          - "1-1"
      - title: "Rename a document"
        text:
          - "From the document picker, long-press the document's icon until a menu appears. Then tap the *Rename* item in the menu."
        images:
          - "1-2"
      - title: "Save and close a document"
        text:
          - "After you've opened your document, it will auto-save as you make changes."
          - "Tap the *❮* button to close your document and return to the document picker."
        images:
          - "1-3"
      - title: "Undo or redo changes"
        text:
          - "To undo a change you've made to your document, tap the *↺* button. To redo a change that you've undone, tap the *↻* button."
          - "The buttons will be disabled if there are no changes to undo or redo."
        images:
          - "1-4"
      - title: "Sort books and pictures"
        text:
          - "Tap the name of your document and then tap the *Sort books and pictures...* item of the menu. A submenu will open that allows you to choose the order that your Picture Library and Button Books are sorted."
        images:
          - "1-5a"
          - "1-5b"
      - title: "Search books and pictures"
        text:
          - "Enter text into the search bar to filter your Picture Library and Button Books. Only pictures and books whose titles match your search text will be shown."
          - "Tap the *✕* button in the search field to clear the text and show all of your pictures and books."
        images:
          - "1-6"

  - title: "Picture Library"
    items:
      - title: "Add a picture"
        text:
          - "Tap the *+* button at the top of your Picture Library to create a new picture. Then select how you would like to create your picture."
        images:
          - "2-1"
        items:
          - title: "Paste from clipboard"
            text:
              - "If your device's copy-paste clipboard contains an image, this menu item will be enabled."
              - "After tapping the menu item, you will be prompted to allow the paste operation."
              - "Images can be copied from many sources. For example, an image can be copied from the web by long-pressing the image and selecting *Copy* from the menu."
            images:
              - "2-1-6b"
              - "2-1-6a"
          - title: "Crop picture"
            text:
              - "After adding a picture from the photo library, camera, file browser, or copy-paste, you will be prompted to crop the image."
              - "Pinch and drag the image with two fingers to zoom and move it. Tap the buttons on either side of the crop boundary to rotate the image 90 degrees."
              - "Tap the *Crop* button to crop the image and add it to your Picture Library."
            images:
              - "2-1-8"
      - title: "Rename, delete, or tag a picture"
        text:
          - "Long-press a picture in your Picture Library and select the corresponding item from the menu."
        images:
          - "2-2,2-3,2-4"
        items:
          - title: "Tag a picture"
            text:
              - "Tap the *Tag...* menu item to reveal the **Tag your picture** menu."
              - "From that menu, tap any tag to apply it to the image."
              - "Tap the *Clear* button to remove all tags from the picture. Tap the *+* button to create a new tag."
            images:
              - "2-4-1"
      - title: "Filter pictures by tag"
        text:
          - "Tap the **tag** icon at the top left of the Picture Library to open the Filter by Tag menu."
          - "The icon is an outline if no tags are currently selected. It is filled if your Picture Library is being filtered by one or more selected tags."
          - "From the menu, tap any tag to select it. Selected tags have a filled icon and a checkmark. Your Picture Library will only show pictures that have one or more of the selected tags."
          - "Tap the *Clear* button to deselect all tags. Tap the *+* button to create a new tag."
          - "Some tags are created automatically and applied to pictures based on how the picture was created."
        images:
          - "2-5a"
          - "2-5b"
        items:
          - title: "Rename or delete a tag"
            text:
              - "Long-press a tag to reveal a menu. Then select the appropriate item from that menu."
            images:
              - "2-5-1"
  - title: "Button Books"
    items:
      - title: "Add a Button Book"
        text:
          - "Tap the *+* button on the top right of the Button Books list to create a new book. Then you will be prompted to name your book."
          - "After your book is created, you'll be taken to the edit screen."
        images:
          - "3-1"
      - title: "Edit a Button Book"
        text:
          - "Tap the *⋯* icon at the top right corner of any Button Book to open the book in editing mode."
          - "See the 'Edit a Button Book' section below."
        images:
          - "3-2"
      - title: "Rename or delete a Button Book"
        text:
          - "Long-press a Button Book and then select the appropriate menu item."
        images:
          - "3-3"
      - title: "View a Button Book"
        text:
          - "Tap anywhere on a Button Book except the edit icon to open the book in viewing mode."
          - "While in viewing mode, any button can be tapped to speak its title."
        items:
          - title: "Exit from a Button Book"
            text:
              - "While a Button Book is open in viewing mode, no header or back button is visible."
              - "To exit from the book, return to the first page and then drag to the right until an *✕* icon in a circle appears."
              - "Hold until the meter is filled to exit the book."
            images:
              - "3-4-1"
      - title: "Lock Button Books"
        text:
          - "The lock settings applies to every Button Book in your Pick-a-Pic document."
          - "To open the **Lock Settings** menu, tap the **lock button** at the top left of the Button Books list."
          - "You may lock books with either Face ID or Touch ID (depending on your device) or a 4-digit passcode."
          - "Tap the switch next to the setting that you wish to apply. If both switches are off then books are unlocked."
        images:
          - "3-5"
        items:
          - title: "Lock with 4-digit passcode"
            text:
              - "When you select *Lock books with passcode*, you will be prompted to enter a 4-digit passcode."
              - "After you enter your passcode, the label next to the switch will display the passcode you entered."
            images:
              - "3-5-1"
          - title: "Keep Pick-a-Pic on-screen"
            text:
              - "You can use your iPad as a dedicated Pick-a-Pic device by setting up [Guided Access](https://support.apple.com/guide/ipad/lock-ipad-to-one-app-ipada16d1374/ipados) on your iPad. Combine this with Lock Settings to force a single Button Book to remain on-screen."
  - title: "Editing a Button Book"
    items:
      - title: "View all pages"
        text:
          - "The editing screen starts in single-page view, where you can add, move, or remove buttons from pages of your Button Book. Swipe horizontally to go to the previous or next page."
          - "Tap the **grid button** to toggle between viewing a single page and viewing all pages."
          - "From the all-pages view, tap any page to navigate to it in single-page view."
        images:
          - "4-0"
      - title: "Add a page to a Button Book"
        text:
          - "From either the single-page or all-pages view, tap the *+* button that appears after the last page of the book."
        images:
          - "4-1a"
          - "4-1b"
      - title: "Remove a page from a Button Book"
        text:
          - "while in the **all-pages** view, long-press a page and then tap *Delete page* on the menu"
        images:
          - "4-2"
      - title: "Arrange the pages in a Button Book"
        text:
          - "While in the **all-pages** view, long-press a page and then drag it to change its placement in your Button Book."
        images:
          - "4-3"
      - title: "Add a button to a page"
        text:
          - "While in the **single-page** view, tap a picture in your Picture Library to create a button on the current page. No need to drag-and-drop!"
        images:
          - "4-4"
      - title: "Remove a button from a page"
        text:
          - "While in the **single-page** view, if you tap the picture in your Picture Library of a button that is on the current page, that button will be removed from the page."
          - "If you tap a picture that has already been added to a different page, the single-page view will scroll to that page."
          - "You may also long-press a button and delete it from the menu that appears."
        images:
          - "4-5"
      - title: "Arrange the buttons on a page"
        text:
          - "While in the **single-page** view, long-press a button and drag it to change where it appears on the page."
          - "The layout of buttons is fixed and depends on the number of buttons you have added to the page. However, you can drag to change the order in which your buttons appear."
        images:
          - "4-6"
      - title: "Set the voice for a Button Book"
        text:
          - "Tap the **speech bubble** button to open the *Voice settings* menu. From that menu, you may select the voice that speaks when buttons are tapped."
        images:
          - "4-7"
      - title: "Other book settings"
        text:
          - "If you would prefer to be able to add the same button to multiple pages of your Button Book, you may enable the *Allow duplicate pictures* setting."
          - "While this settings is enabled, page numbers will not be shown for pictures that have been added as buttons to your Button Book."
        images:
          - "4-8"
  - title: "Purchasing Pick-a-Pic"
    items:
      - title: "Unlock the full app"
        text:
          - "The free version of Pick-a-Pic has a limit of 20 pictures in your Picture Library."
          - "To remove that limit, tap the *Support Pick-a-Pic* button at the bottom of the screen. If that button is not visible then you've already unlocked the full version."
        images:
          - "5-1"
      - title: "Restore your purchase"
        text:
          - "If you've already purchased Pick-a-Pic then there is no need to purchase it again. Instead, tap the name of the file and then tap the *Restore previous purchases* menu item."
          - "The same button can also be found on the purchasing modal."
        images:
          - "5-2a"
          - "5-2b"
