---
- title: "Pick-a-Pic Documents"
  items:
    - title: "Create or open document"
      text:
        - "The app first opens to the document picker. Tap the 'Create Document' icon or the plus button to create a new Pick-a-Pic document."
        - "Each document contains its own Picture Library and collection of Picture Books."
        - "To open an existing document, tap that document's icon."
      images:
        - "1-1"
    - title: "Rename document"
      text:
        - "To rename your Pick-a-Pic document, tap and hold the document's icon until a menu appears. Then tap the 'Rename' item in the menu."
      images:
        - "1-2"
    - title: "Save and close"
      text:
        - "After you've opened your document, it will auto-save as you make changes."
        - "Tap the back button to close your document and return to the document picker."
      images:
        - "1-3"
    - title: "Undo / redo"
      text:
        - "To undo a change you've made to your document, tap the left-facing arrow button. To redo a change that you've undone, tap the right-facing arrow button."
        - "The buttons will be disabled if there are no changes to undo or redo."
      images:
        - "1-4"
